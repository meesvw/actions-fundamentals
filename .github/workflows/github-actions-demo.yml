name: GitHub Actions Demo

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        type: environment
        required: true
  
  push:
    branches: [main]
  
  pull_request:
    branches: [main]
  
  schedule:
    - cron: '15 6 * * 0'

permissions:
  contents: read

cache-mode: none

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Print event name
      run: echo "${{github.EVENT_NAME}}"
    - name: Print current branch
      run: echo "${{github.REF}}"
    - name: Print all files in repo
      run: tree

  Test:
    if: ${{github.EVENT_NAME == 'workflow_dispatch'}}
    needs: build
    runs-on: ubuntu-26.04
    environment: Test
    steps:
    - name: Print to console
      run: echo "Testing..."

  Load-Test:
    if: ${{github.EVENT_NAME == 'workflow_dispatch'}}
    needs: build
    runs-on: ubuntu-26.04
    environment: Load-Test
    steps:
    - name: Print to console and sleep
      run: | 
        echo "Testing..."
        sleep 15

  Production:
    if: ${{inputs.environment == 'Production'}}
    runs-on: ubuntu-26.04
    needs:
    - Test
    - Load-Test
    environment:
      name: Production
      url: https://writeabout.net
    steps:
    - run: | 
        echo "Step 1 deploying..."
        sleep 10
    - run: | 
        echo "Step 2 deploying..."
        sleep 10
    - run: | 
        echo "Step 3 deploying..."
        sleep 10
    - run: | 
        echo "Step 4 deploying..."
        sleep 10
    - run: | 
        echo "Step 5 deploying..."
        sleep 10
