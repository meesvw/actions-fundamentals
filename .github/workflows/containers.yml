name: Containers
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  step-container:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Print OS release Ubuntu
      run: cat /etc/os-release
    
    - name: Print OS release Alpine
      uses: docker://alpine:3.22
      with:
        entrypoint: /bin/sh
        args: -c "cat /etc/os-release"

  job-container:
    runs-on: node:22-bookworm-slim
    steps:
    - name: Print OS release Node
      run: cat /ec/os-release
    
    - name: Print nodejs version
      run: node -v
      
        
