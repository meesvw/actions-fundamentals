name: Containers
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  step-container:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Print OS release Ubuntu
      run: cat /etc/os-release
    
    - name: Print OS release Alpine
      uses: docker://alpine:3.22
      with:
        entrypoint: /bin/sh
        args: -c "cat /etc/os-release"

  job-container:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm-slim
    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
    - name: Print OS release Node
      run: cat /etc/os-release
    
    - name: Print nodejs version
      run: node -v

    - name: Reach the service by name
      run: |
        node -e "const s=require('net').connect(6379,'redis',()=>{s.write('PING\r\n')});s.on('data',d=>{console.log(d.toString());s.end()});"
    
  missing-tools:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.22
    steps:
    - name: Install dependencies
      run: |
        apk add --no-cache \
          bash \
          git
    
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Run git log
      shell: bash 
      run: git log -1
